[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.31.3", features = ["fs", "net"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
